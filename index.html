<script>
const CARDS = [
  {
    slide: 1,
    title: "开场故事 · 为什么做 BrandLex",
    time: "00:00 – 01:00",
    cue: "停在 Slide 1 封面自然开场；讲到「不是翻译，而是优化」时稍微停顿加重。",
    paragraphs: [
      { text: "我们的 final project 叫 <span class='hl'>BrandLex</span>，基于 <span class='hl'>Topic 2</span> 来进行的设计和实施。" },
      { text: "BrandLex 是什么？它是一个围绕我们收集的两文三语 marketing 词库、跨市场表达方式来做的一个网站工具，是一个具备让市场人员从日常学习、刷灵感，到文案本地化智能优化（注意，<span class='key'>不是翻译，而是优化</span>）的平台。", focus: true },
      { text: "为什么我们会选这个方向？其实有两个契机：" },
      { text: "<span class='hl'>第一</span>，我们发现做跨境或者大湾区营销，很容易踩本地表达坑——想要在三地宣发一个产品，用词完全不是一回事；比如，直接拿简繁转换会穿帮，丢给普通 AI 写又容易写成僵硬的直译腔，同一个词今天这样翻、明天那样翻，品牌调性全散了。" },
      { text: "<span class='hl'>第二</span>，这其实也是我们把上学期萧老师那门 <span class='key'>Localisation and Bilingual Web Development</span>，和这学期课程结合起来的一次尝试——把双语网页本地化的底子，加上 AI 和 NLP 营销工具，做成一个真的能打开就用的工作台。" }
    ]
  },
  {
    slide: 2,
    title: "三个案例 · 本土化表达差异",
    time: "01:00 – 01:55",
    cue: "依次指向屏幕上三行对照，每讲完一组停顿 1 秒，让老师和同学扫一眼屏幕。",
    paragraphs: [
      { text: "痛点是什么呢，我们来看这三个例子：" },
      { text: "<span class='hl'>第一个，「包邮」</span>，内地电商天天用，但你原封不动搬到香港，本地用户一眼就觉得怪，香港商业语境习惯说 <span class='key'>「免運費」</span>，英文就是 Free Shipping。" },
      { text: "<span class='hl'>第二个</span>，小红书最爱说的 <span class='hl'>「种草」</span>，在香港 IG 语境里更自然的是 <span class='key'>「好物推介」</span>，英文叫 Product Seeding。" },
      { text: "<span class='hl'>第三个</span>，活动促销里的 <span class='hl'>「早鸟福利」</span>，内地偏直给实惠，香港品牌更讲究礼遇感，会写成 <span class='key'>「早鳥禮遇」</span>，英文对应 Early-Bird Offer。" },
      { text: "大家可以看到，这不是换几个繁体字的事，而是背后一整套 <span class='key'>市场语感和消费习惯</span> 的切换。", focus: true }
    ]
  },
  {
    slide: 3,
    title: "产品定位 · 三个核心特性",
    time: "01:55 – 02:50",
    cue: "从左到右扫过 3 张卡片，重点抛出「轻量级 AI Harness」给 Slide 5 埋伏笔。",
    paragraphs: [
      { text: "那 BrandLex 到底帮 marketing 人员解决什么问题？我们整体做了三个特性：" },
      { text: "<span class='hl'>第一个「首页」</span>，就是门面和快速体验区，进来几秒钟就能看懂一稿三地怎么变，很简单。" },
      { text: "<span class='hl'>第二个「文案改写」</span>，解决的是写稿慢、AI 容易胡乱发挥的问题——它先把你的文案和词库做 <span class='hl'>RAG 检索</span>，再结合系统提示词路由到 DeepSeek 去改写，这是一个 <span class='key'>轻量级的 AI Harness</span> 做法，约束稳定、可靠输出。", focus: true },
      { text: "<span class='hl'>第三个「学习」</span>，解决的是传统 Excel 术语表、字典根本没人愿意翻的痛点——我们把 <span class='hl'>3,208 组</span> 三语表达做成卡片流，没事刷一刷，带着例句和避坑提醒，查词的同时直接学会怎么用。" }
    ]
  },
  {
    slide: 4,
    title: "实机演示 · 线上网站点一点",
    time: "02:50 – 03:55",
    cueHtml: "<span class='cue-label'>实机点击路径（提前开好标签页）</span><ol><li>切到浏览器：<a href='https://ethanhotline.pythonanywhere.com/' target='_blank' rel='noopener'>ethanhotline.pythonanywhere.com</a></li><li>轻轻晃动鼠标带过首页大标题，视线落到下方互动预览窗</li><li>点 <b>HK 香港繁中</b>，依次指底部 3 枚改动标签</li><li>依次点 <b>CN 内地简中</b> 和 <b>EN English</b>（各停 2 秒）</li><li>切回 PPT 第 5 页</li></ol>",
    paragraphs: [
      { text: "我们直接切到真实线上部署的环境上来体验一下。" },
      { text: "页面整体也很简洁舒服。" },
      { text: "大家看下面这个互动预览窗，上面是一条很典型的活动原稿：LUMA 联名香氛礼盒上线，11 月 15 至 17 日预订享早鸟福利 HK$280，香港包邮。" },
      { text: "我现在点一下 <span class='key'>「HK 香港繁中」</span>，大家看下面标出来的三处改动：联名换成了 <span class='hl'>「跨界聯乘」</span>，早鸟福利换成了 <span class='hl'>「早鳥禮遇」</span>，包邮换成了 <span class='hl'>「免運費」</span>，整段读起来马上就是香港品牌的口吻。", focus: true },
      { text: "再切到 <span class='hl'>「CN 内地简中」</span> 和 <span class='hl'>「EN English」</span>，同一条简报，三地风格一眼对比得很清楚。" },
      { text: "具体的功能我留给后面队友演示，我先切回 PPT 讲一下背后的技术架构。" }
    ]
  },
  {
    slide: 5,
    title: "技术架构 · AI Harness 与算力分层",
    time: "03:55 – 04:55",
    cue: "按「核心思路 → 左：数据与检索 → 右：云端改写 → 下：交付层」四步指图讲，语速稳健。",
    paragraphs: [
      { text: "在整体的技术架构上，刚才我提到了 <span class='key'>AI Harness</span> 的概念，我做架构的时候也是基于这个思维来设计和优化我们的架构。" },
      { text: "核心思路是：<span class='key'>算力分层、职责解耦</span>。", focus: true },
      { text: "<span class='hl'>左边这里是数据层</span>，用 <span class='hl'>SQLite 事务</span> 加 <span class='hl'>JSON 原子快照</span> 做双写；检索层我们摒弃全文模糊扫描，而是针对两个场景分别写了数据结构：查词走 <span class='key'>1/2-Gram 倒排索引</span>，整段原稿扫词走 <span class='key'>AC 自动机</span>，一次扫描就能把命中词条全部抓出来，响应压在毫秒级。" },
      { text: "<span class='hl'>再看右边</span>，拿到命中的词库约束后，才调用 <span class='hl'>DeepSeek API</span> 做三地风格改写，风格化的部分我们也是通过系统提示词的方式来实现。" },
      { text: "<span class='hl'>下面交付层</span>也很干净：后端是标准 <span class='hl'>Python Flask WSGI</span>，前端没套臃肿框架，纯原生 <span class='hl'>Vanilla JS</span> 单页应用，零构建依赖，打开即用。" }
    ]
  },
  {
    slide: 6,
    title: "数据规模 · 移交下一位同学",
    time: "04:55 – 05:30",
    cue: "停在 3,208 大数字画面，说完最后一句微笑看向下一位同学（ZHAO Boxin）自然交棒。",
    paragraphs: [
      { text: "目前我们整个系统里，已经内置了 <span class='key'>3,208 条</span> 横跨 <span class='hl'>12 个</span> 营销领域的词库，当然，基于我们的维护模式设计，词库还能不断增加、优化。" },
      { text: "这三千多条词到底怎么建出来的？我们又是怎么做到毫秒级精准检索、不误伤缩写的？<span class='key'>接下来让下一位同学来介绍。</span>", focus: true }
    ]
  }
];
/* CORE START */
const ReaderCore = (() => {
  const clamp = (n, min, max) => Math.max(min, Math.min(max, n));
  const number = (n, fallback) => typeof n === 'number' && Number.isFinite(n) ? n : fallback;
  const formatTime = ms => {
    const seconds = Math.floor(Math.max(0, ms) / 1000);
    return `${String(Math.floor(seconds / 60)).padStart(2,'0')}:${String(seconds % 60).padStart(2,'0')}`;
  };
  const elapsed = (timer, now) => timer.elapsed + (timer.startedAt === null ? 0 : Math.max(0, now - timer.startedAt));
  const columnHeight = (heights, gap) => heights.reduce((total, h) => total + h, 0) + Math.max(0, heights.length - 1) * gap;
  function bestSplit(heights, gap = 0) {
    if (heights.length < 2) return heights.length;
    return heights.slice(1).reduce((best, _, j) => {
      const at = j + 1;
      const score = split => Math.max(columnHeight(heights.slice(0, split), gap), columnHeight(heights.slice(split), gap));
      return score(at) < score(best) ? at : best;
    }, 1);
  }
  function restore(saved, count) {
    const s = saved && typeof saved === 'object' ? saved : {};
    const t = s.timer && typeof s.timer === 'object' ? s.timer : {};
    return {slide:Math.floor(clamp(number(s.slide,0),0,count-1)),theme:s.theme==='light'?'light':'dark',
      timer:{elapsed:Math.max(0,number(t.elapsed,0)),startedAt:typeof t.startedAt==='number'&&Number.isFinite(t.startedAt)?t.startedAt:null}};
  }
  return {clamp,formatTime,elapsed,columnHeight,bestSplit,restore};
})();
/* CORE END */
const STORAGE_KEY = 'brandlex-speaker-v3';
const SHORT_TITLES = ['开场故事','本土化差异','三个核心特性','实机演示','技术架构','数据与交棒'];
const $ = id => document.getElementById(id);
const stage = $('stage');
const script = $('script');
const measure = $('measure');
const settings = $('settings-dialog');
let storageUnavailable = false;
let state = loadState();
let completed = false;
let layout = {columns:1, splits:CARDS.map(c=>c.paragraphs.length),font:24,fits:true};
let fitFrame,toastTimeout;
let wakeLock = null;
let wakePending = false;
let wakeGeneration = 0;
function notify(message) {
  clearTimeout(toastTimeout); $('toast').textContent=message;
  toastTimeout=setTimeout(()=>{$('toast').textContent='';},3800);
}
function loadState() {
  try {return ReaderCore.restore(JSON.parse(localStorage.getItem(STORAGE_KEY)||localStorage.getItem('brandlex-speaker-v2')),CARDS.length);}
  catch(error){storageUnavailable=true;return ReaderCore.restore(null,CARDS.length);}
}
function persist() {
  try {localStorage.setItem(STORAGE_KEY,JSON.stringify(state));}
  catch(error){if(!storageUnavailable)notify('浏览器未能保存记录，本次仍可正常阅读');storageUnavailable=true;}
}
function updateState(patch){state={...state,...patch};persist();}
function paragraphHTML(p,i){return `<p class="paragraph${p.focus?' focus':''}" data-number="${String(i+1).padStart(2,'0')}">${p.text}</p>`;}
function measureCards(columns,width,height) {
  const gap=parseFloat(getComputedStyle(measure).getPropertyValue('--paragraph-gap'));
  measure.style.width=width+'px';
  const cards=CARDS.map(card=>{
    measure.innerHTML=card.paragraphs.map(paragraphHTML).join('');
    const heights=[...measure.children].map(p=>p.getBoundingClientRect().height);
    const split=columns===2?ReaderCore.bestSplit(heights,gap):heights.length;
    const used=Math.max(ReaderCore.columnHeight(heights.slice(0,split),gap),ReaderCore.columnHeight(heights.slice(split),gap));
    return {split,fits:used<=height-2};
  });
  return {splits:cards.map(c=>c.split),fits:cards.every(c=>c.fits)};
}
function fitLayout(columns,width,height) {
  // The second column's divider padding is included in the measurement width.
  const columnWidth=columns===2?(width-36)/2-24:width;
  let result,font=26;
  for(;font>=16;font-=.5){
    document.documentElement.style.setProperty('--fit-font',font+'px');
    result=measureCards(columns,columnWidth,height);
    if(result.fits)break;
  }
  return {columns,splits:result.splits,font:Math.max(16,font),fits:result.fits};
}
function fitAllCards() {
  const style=getComputedStyle(stage);
  const width=stage.clientWidth-parseFloat(style.paddingLeft)-parseFloat(style.paddingRight);
  const height=stage.clientHeight-parseFloat(style.paddingTop)-parseFloat(style.paddingBottom);
  if(width<=0||height<=0)return;
  layout=fitLayout(width>=700?2:1,width,height);
  if(layout.columns===2&&layout.font<20){
    const single=fitLayout(1,width,height);
    if(single.font>layout.font||(!layout.fits&&single.fits))layout=single;
  }
  document.documentElement.style.setProperty('--fit-font',layout.font+'px');
  measure.replaceChildren();
  stage.classList.toggle('compact-fallback',!layout.fits);
  $('fit-notice').textContent=layout.fits?'':'请展开手机或横向使用，以完整显示一屏稿';
  $('fit-status').textContent=`全文自动适配一屏 · ${layout.font}px · ${layout.columns===2?'双栏':'单栏'}`;
  renderText();
}
function scheduleFit(){cancelAnimationFrame(fitFrame);fitFrame=requestAnimationFrame(fitAllCards);}
function renderText(){
  const card=CARDS[state.slide];
  const split=layout.splits[state.slide];
  script.style.setProperty('--columns',layout.columns);
  const parts=layout.columns===2?[card.paragraphs.slice(0,split),card.paragraphs.slice(split)]:[card.paragraphs];
  script.innerHTML=parts.map((part,col)=>`<div class="column">${part.map((p,i)=>paragraphHTML(p,i+(col?split:0))).join('')}</div>`).join('');
  stage.scrollTop=0;stage.scrollLeft=0;
}
function renderControls(){
  $('prev-btn').disabled=state.slide===0;
  $('next-label').textContent=completed?'演讲已结束':state.slide===CARDS.length-1?'完成演讲':'下一张';
  $('next-btn').setAttribute('aria-label',completed?'演讲已结束':state.slide===CARDS.length-1?'完成演讲':'下一张');
  $('next-btn').disabled=completed;
  [...$('outline').children].forEach((button,i)=>{
    if(i===state.slide)button.setAttribute('aria-current','step');else button.removeAttribute('aria-current');
  });
}
function renderCard(){
  const card=CARDS[state.slide];
  $('slide-badge').textContent=`${String(state.slide+1).padStart(2,'0')} / ${String(CARDS.length).padStart(2,'0')}`;
  $('card-title').textContent=card.title;
  $('card-time').textContent=card.time;
  $('cue-content').innerHTML=card.cueHtml||card.cue;
  $('page-announcement').textContent=`第 ${state.slide+1} 张，${card.title}`;
  renderText();renderControls();
}
function go(index){
  if(index<0||index>=CARDS.length||index===state.slide)return;
  updateState({slide:index});completed=false;renderCard();
}
function nextCard(){
  if(state.slide<CARDS.length-1){go(state.slide+1);return;}
  if(state.timer.startedAt!==null)toggleTimer();
  completed=true;renderControls();notify('演讲结束，接下来交给下一位同学');
}
function applyAppearance(){
  document.body.classList.toggle('light',state.theme==='light');
  document.querySelector('meta[name="theme-color"]').content=state.theme==='light'?'#faf9f5':'#141615';
  $('dark-theme').setAttribute('aria-pressed',String(state.theme==='dark'));
  $('light-theme').setAttribute('aria-pressed',String(state.theme==='light'));
}
function renderTimer() {
  const elapsed = ReaderCore.elapsed(state.timer, Date.now());
  const running = state.timer.startedAt !== null;
  $('timer-value').textContent = ReaderCore.formatTime(elapsed);
  $('timer-btn').classList.toggle('running', running);
  $('timer-btn').setAttribute('aria-label', (running ? '暂停计时，已用' : '开始演讲计时，已用') + ReaderCore.formatTime(elapsed));
  $('timer-icon').innerHTML = running ? '<path d="M8 5v14M16 5v14"/>' : '<path d="m9 5 10 7-10 7Z"/>';
  $('clock-goal').textContent = elapsed === 0 ? '目标 05:30' : elapsed > 330000 ? `已超时 ${ReaderCore.formatTime(elapsed - 330000)}` : `剩余 ${ReaderCore.formatTime(330000 - elapsed)}`;
}
function toggleTimer() {
  const running = state.timer.startedAt !== null;
  updateState({timer: {elapsed: ReaderCore.elapsed(state.timer, Date.now()), startedAt: running ? null : Date.now()}});
  completed = false;
  renderTimer();
  renderControls();
  if (running) releaseWakeLock(); else requestWakeLock();
}
function wakeStatus(text, active) {
  $('awake-status').textContent = text;
  $('awake-dot').classList.toggle('on', active);
}
async function requestWakeLock() {
  if (state.timer.startedAt === null || document.visibilityState !== 'visible' || wakeLock || wakePending) return;
  if (!('wakeLock' in navigator)) { wakeStatus('请在系统设置延长锁屏时间', false); return; }
  const generation = ++wakeGeneration;
  wakePending = true;
  try {
    const lock = await navigator.wakeLock.request('screen');
    if (generation !== wakeGeneration || state.timer.startedAt === null || document.visibilityState !== 'visible' || lock.released) {
      if (!lock.released) await lock.release();
      return;
    }
    wakeLock = lock;
    wakeStatus('演讲中 · 屏幕保持亮起', true);
    lock.addEventListener('release', () => {
      if (wakeLock !== lock) return;
      wakeLock = null;
      wakeStatus(state.timer.startedAt === null ? '计时已暂停' : '亮屏已释放', false);
      if (state.timer.startedAt !== null && document.visibilityState === 'visible') requestWakeLock();
    });
  } catch (error) {
    if (generation === wakeGeneration) wakeStatus('未能保持亮屏，请检查自动锁定', false);
  } finally {
    if (generation === wakeGeneration) wakePending = false;
  }
}
async function releaseWakeLock() {
  ++wakeGeneration;
  wakePending = false;
  const previous = wakeLock;
  wakeLock = null;
  try { if (previous && !previous.released) await previous.release(); }
  catch (error) { wakeStatus('请检查系统自动锁定', false); }
  if (state.timer.startedAt === null) wakeStatus('计时已暂停', false);
  else requestWakeLock();
}

function confirmReset(button,action){
  if(button.dataset.confirming==='yes'){action();button.dataset.confirming='';button.textContent=button.dataset.label;}
  else{button.dataset.label=button.textContent;button.dataset.confirming='yes';button.textContent='再次点击确认';
    setTimeout(()=>{button.dataset.confirming='';button.textContent=button.dataset.label;},3500);}
}
CARDS.forEach((card,i)=>{
  const button=document.createElement('button');button.type='button';button.textContent=String(i+1).padStart(2,'0');
  button.setAttribute('aria-label',`第${i+1}张 ${SHORT_TITLES[i]}`);button.addEventListener('click',()=>go(i));$('outline').appendChild(button);
});
$('next-btn').addEventListener('click',nextCard);
$('prev-btn').addEventListener('click',()=>go(state.slide-1));
$('settings-btn').addEventListener('click',()=>settings.showModal());
$('cue-btn').addEventListener('click',()=>$('cue-dialog').showModal());
$('dark-theme').addEventListener('click',()=>{updateState({theme:'dark'});applyAppearance();});
$('light-theme').addEventListener('click',()=>{updateState({theme:'light'});applyAppearance();});
$('timer-btn').addEventListener('click',toggleTimer);
$('reset-timer').addEventListener('click',event=>confirmReset(event.currentTarget,()=>{updateState({timer:{elapsed:0,startedAt:null}});renderTimer();releaseWakeLock();}));
$('start-over').addEventListener('click',event=>confirmReset(event.currentTarget,()=>{updateState({slide:0,timer:{elapsed:0,startedAt:null}});completed=false;renderCard();renderTimer();releaseWakeLock();settings.close();}));
document.querySelectorAll('[data-close]').forEach(button=>button.addEventListener('click',()=>$(button.dataset.close).close()));
document.addEventListener('keydown',event=>{
  if(document.querySelector('dialog[open]')||event.target.closest('button,a'))return;
  if(event.key==='ArrowRight'||event.key===' '){event.preventDefault();nextCard();}
  else if(event.key==='ArrowLeft'){event.preventDefault();go(state.slide-1);}
});
new ResizeObserver(scheduleFit).observe(stage);
window.addEventListener('resize',scheduleFit);
window.addEventListener('pagehide',persist);
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='hidden')persist();else{renderTimer();requestWakeLock();scheduleFit();}});
document.fonts.ready.then(scheduleFit);
document.fonts.addEventListener('loadingdone',scheduleFit);
applyAppearance();renderCard();scheduleFit();renderTimer();setInterval(renderTimer,500);
if(state.timer.startedAt!==null)requestWakeLock();
if(storageUnavailable)notify('浏览器未能读取记录，已从第一张开始');

</script>
</body>
</html>
